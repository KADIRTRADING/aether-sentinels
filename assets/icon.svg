<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2e"/>
      <stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e0d0"/>
      <stop offset="1" stop-color="#6a5cff"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6a5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6a5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="200" fill="url(#halo)"/>
  <!-- outer sentinel ring -->
  <g fill="none" stroke="url(#glow)" stroke-width="14" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke-opacity="0.35"/>
  </g>
  <!-- hex core -->
  <g transform="translate(256,256)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="none" stroke="url(#glow)" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="0,-64 55,-32 55,32 0,64 -55,32 -55,-32" fill="url(#glow)"/>
    <!-- lightning bolt (Arc Coil emblem) -->
    <path d="M 16 -46 L -22 8 L 6 8 L -16 50 L 34 -6 L 4 -6 Z" fill="#0a0e1a"/>
  </g>
  <!-- orbiting nodes -->
  <g fill="#35e0d0">
    <circle cx="256" cy="86" r="14"/>
    <circle cx="411" cy="326" r="12"/>
    <circle cx="101" cy="326" r="12"/>
  </g>
</svg>
